create-release:
  name: Create GitHub Release
  runs-on: ubuntu-latest
  needs: [ export-windows-linux, export-macos ]
  steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: build-artifacts

    - name: Create Release (via actions/create-release)
      id: create_release
      uses: actions/create-release@v1
      with:
        tag_name: ${{ github.ref_name }}
        release_name: Release ${{ github.ref_name }}
        body: Automated release for tag ${{ github.ref_name }}
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    # ---------- 将下载的产物目录打包为 zip（以确保上传文件是 zip） ----------
    - name: Zip Linux artifact
      run: |
        ART_DIR="build-artifacts/Slay-the-Spire-Like-linux"
        ZIP_PATH="${ART_DIR}.zip"
        if [ -d "$ART_DIR" ]; then
          echo "Zipping $ART_DIR -> $ZIP_PATH"
          rm -f "$ZIP_PATH"
          (cd "$(dirname "$ART_DIR")" && zip -r "$(basename "$ZIP_PATH")" "$(basename "$ART_DIR")")
        else
          echo "Warning: $ART_DIR not found, skipping"
        fi

    - name: Zip macOS artifact
      run: |
        ART_DIR="build-artifacts/Slay-the-Spire-Like-macOS"
        ZIP_PATH="${ART_DIR}.zip"
        if [ -d "$ART_DIR" ]; then
          echo "Zipping $ART_DIR -> $ZIP_PATH"
          rm -f "$ZIP_PATH"
          (cd "$(dirname "$ART_DIR")" && zip -r "$(basename "$ZIP_PATH")" "$(basename "$ART_DIR")")
        else
          echo "Warning: $ART_DIR not found, skipping"
        fi

    - name: Zip Windows artifact
      run: |
        ART_DIR="build-artifacts/Slay-the-Spire-Like-windows"
        ZIP_PATH="${ART_DIR}.zip"
        if [ -d "$ART_DIR" ]; then
          echo "Zipping $ART_DIR -> $ZIP_PATH"
          rm -f "$ZIP_PATH"
          (cd "$(dirname "$ART_DIR")" && zip -r "$(basename "$ZIP_PATH")" "$(basename "$ART_DIR")")
        else
          echo "Warning: $ART_DIR not found, skipping"
        fi

    # ---------- 使用官方 action 上传每个 zip 到 Release ----------
    - name: Upload Linux asset to Release
      uses: actions/upload-release-asset@v1
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: build-artifacts/Slay-the-Spire-Like-linux.zip
        asset_name: Slay-the-Spire-Like-linux.zip
        asset_content_type: application/zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload macOS asset to Release
      uses: actions/upload-release-asset@v1
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: build-artifacts/Slay-the-Spire-Like-macOS.zip
        asset_name: Slay-the-Spire-Like-macOS.zip
        asset_content_type: application/zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload Windows asset to Release
      uses: actions/upload-release-asset@v1
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: build-artifacts/Slay-the-Spire-Like-windows.zip
        asset_name: Slay-the-Spire-Like-windows.zip
        asset_content_type: application/zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: List uploaded release assets (debug)
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        REPO: ${{ github.repository }}
        TAG: ${{ github.ref_name }}
      run: |
        RELEASE_INFO=$(curl -sSL -H "Authorization: token ${GITHUB_TOKEN}" \
          "https://api.github.com/repos/${REPO}/releases/tags/${TAG}")
        echo "$RELEASE_INFO" | jq '.assets | map({name: .name, size: .size, url: .browser_download_url})'
