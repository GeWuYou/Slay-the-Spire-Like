name: Export Game

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  GODOT_VERSION: 4.5.1
  EXPORT_NAME: Slay the Spire Like

jobs:
  export-windows-linux:
    name: Export Windows & Linux
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Prepare names (create EXPORT_SLUG)
        run: |
          echo "EXPORT_NAME=${EXPORT_NAME}" >> $GITHUB_ENV
          # replace spaces with underscore to avoid path issues
          EXPORT_SLUG="${EXPORT_NAME// /_}"
          echo "EXPORT_SLUG=${EXPORT_SLUG}" >> $GITHUB_ENV
          echo "Prepared EXPORT_SLUG=${EXPORT_SLUG}"

      - name: Setup .NET (for restore/build)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore NuGet packages
        run: |
          if [ -f "${{ env.EXPORT_NAME }}.sln" ]; then
            dotnet restore "${{ env.EXPORT_NAME }}.sln"
          else
            echo "Solution file not found, skipping dotnet restore"
          fi

      - name: Setup Godot (includes export templates)
        uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ env.GODOT_VERSION }}
          include-importer: true
          include-templates: true

      - name: Build C# project (if applicable)
        run: |
          set -eux
          godot --headless --build-solutions --quit

      - name: Create export dirs
        run: |
          mkdir -p build/windows
          mkdir -p build/linux

      - name: Export Windows Desktop (x86_64)
        run: |
          set -eux
          godot --headless --export-release "Windows Desktop" build/windows/${EXPORT_SLUG}.exe --quit

      - name: Verify Windows export
        run: |
          ls -la build/windows || true
          if [ ! -f "build/windows/${EXPORT_SLUG}.exe" ]; then
            echo "Windows export missing: build/windows/${EXPORT_SLUG}.exe"
            exit 2
          fi

      - name: Export Linux (x86_64)
        run: |
          set -eux
          godot --headless --export-release "Linux" build/linux/${EXPORT_SLUG}.x86_64 --quit

      - name: Verify Linux export
        run: |
          ls -la build/linux || true
          if [ ! -f "build/linux/${EXPORT_SLUG}.x86_64" ]; then
            echo "Linux export missing: build/linux/${EXPORT_SLUG}.x86_64"
            exit 2
          fi

      - name: Zip Windows & Linux outputs
        run: |
          set -eux
          cd build
          if [ -f "windows/${EXPORT_SLUG}.exe" ]; then
            zip -j "${EXPORT_SLUG}-windows.zip" "windows/${EXPORT_SLUG}.exe"
          else
            echo "No windows exe, skipping windows zip"
          fi
          if [ -f "linux/${EXPORT_SLUG}.x86_64" ]; then
            zip -j "${EXPORT_SLUG}-linux.zip" "linux/${EXPORT_SLUG}.x86_64"
          else
            echo "No linux binary, skipping linux zip"
          fi
          ls -la .

      - name: Upload Windows & Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.EXPORT_NAME }}-windows-linux
          path: build/*.zip
          if-no-files-found: warn

  export-macos:
    name: Export macOS
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Prepare names (create EXPORT_SLUG)
        run: |
          echo "EXPORT_NAME=${EXPORT_NAME}" >> $GITHUB_ENV
          EXPORT_SLUG="${EXPORT_NAME// /_}"
          echo "EXPORT_SLUG=${EXPORT_SLUG}" >> $GITHUB_ENV
          echo "Prepared EXPORT_SLUG=${EXPORT_SLUG}"

      - name: Setup .NET (for restore/build)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore NuGet packages
        run: |
          if [ -f "${{ env.EXPORT_NAME }}.sln" ]; then
            dotnet restore "${{ env.EXPORT_NAME }}.sln"
          else
            echo "Solution file not found, skipping dotnet restore"
          fi

      - name: Setup Godot on macOS (includes export templates)
        uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ env.GODOT_VERSION }}
          include-importer: true
          include-templates: true

      - name: Build C# project (if applicable)
        run: |
          set -eux
          godot --headless --build-solutions --quit

      - name: Debug: show templates & export_presets.cfg
        run: |
          echo "Templates (possible locations):"
          ls -la "$HOME/Library/Application Support/Godot/templates" || true
          ls -la "$HOME/Library/Application Support/Godot/templates/"* || true
          echo "export_presets.cfg preview:"
          sed -n '1,200p' export_presets.cfg || true

      - name: Adjust macOS preset for CI (arch -> x86_64, disable codesign)
        run: |
          # Backup
          cp export_presets.cfg export_presets.cfg.ci.bak || true
          # Use Python replace to avoid sed quoting portability issues
          python3 - <<'PY'
  import io,sys
  p='export_presets.cfg'
  s=io.open(p,'r',encoding='utf-8').read()
  s=s.replace('binary_format/architecture="universal"','binary_format/architecture="x86_64"')
  s=s.replace('codesign/codesign=1','codesign/codesign=0')
  io.open(p,'w',encoding='utf-8').write(s)
  print('Adjusted export_presets.cfg for CI (arch->x86_64, codesign->0).')
  PY
  sed -n '1,120p' export_presets.cfg || true

- name: Create macOS export dir
  run: |
    mkdir -p build/macos

- name: Export macOS (.app)
  run: |
    set -eux
    godot --headless --export-release "macOS" build/macos/${EXPORT_SLUG}.app --quit

- name: Verify macOS export and zip
  run: |
    ls -la build/macos || true
    if [ ! -d "build/macos/${EXPORT_SLUG}.app" ]; then
      echo ".app not found: build/macos/${EXPORT_SLUG}.app"
      exit 2
    fi
    cd build/macos
    zip -r ../${EXPORT_SLUG}-macOS.zip "${EXPORT_SLUG}.app"
    cd ../..
    ls -la build

- name: Upload macOS artifact
  uses: actions/upload-artifact@v4
  with:
    name: ${{ env.EXPORT_NAME }}-macOS
    path: build/*.zip
    if-no-files-found: warn
